name: Deploy to Live Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Deploy
        run: |
          curl -sk -X POST \
            -H "Authorization: cpanel freehtbn:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://ftp.freedomgladiators.net:2083/execute/VersionControl/update" \
            -d "repository=/home/freehtbn/repositories/grainnofoods" \
            -d "branch=main"
