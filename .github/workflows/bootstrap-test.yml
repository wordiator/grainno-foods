name: Bootstrap cPanel API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync two theme files directly via cPanel Fileman (bypasses broken git pull)
        env:
          TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: |
          HOST="https://grainnofoods.com:2083"
          BASE_LIVE="/home/freehtbn/grainnofoods.com/wp-content/themes/grainno-child"
          BASE_REPO="wp-content/themes/grainno-child"

          sync_file() {
            local relpath="$1"
            local dir file
            dir="$BASE_LIVE/$(dirname "$relpath")"
            file="$(basename "$relpath")"
            echo "=== Syncing $relpath -> $dir/$file ==="
            curl -sk -w "\nHTTP_STATUS:%{http_code}\n" \
              -H "Authorization: cpanel freehtbn:$TOKEN" \
              --data-urlencode "dir=$dir" \
              --data-urlencode "file=$file" \
              --data-urlencode "content@$BASE_REPO/$relpath" \
              "$HOST/execute/Fileman/save_file_content" \
              | tail -c 500
            echo "---"
          }

          sync_file "template-gbt-sales.php"
          sync_file "gbt-sales/style.css"
